services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      BOOPANG_PRICE_INCLUDES_VAT: "false"
      BOOPANG_FREE_SHIPPING_THRESHOLD: "50000"
      BOOPANG_SHIPPING_FEE: "3000"
    restart: unless-stopped
    read_only: true
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
