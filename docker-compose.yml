# 실행: docker compose up --build -d   →   http://localhost:${HTTP_PORT:-80}
# 상태: docker compose ps   (app / nginx 모두 healthy 여야 함)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      BOOPANG_VAT_ENABLED: "true"
      BOOPANG_PRICE_INCLUDES_VAT: "false"
      BOOPANG_BILL_BASIS: "received"          # received | ordered
      BOOPANG_FREE_SHIPPING_THRESHOLD: "50000"
      BOOPANG_SHIPPING_FEE: "3000"
      # --- 범용 소프트웨어 팩토리 (유료 LLM 호출이므로 기본 비활성) ---
      BOOPANG_FACTORY_ENABLED: "${BOOPANG_FACTORY_ENABLED:-false}"
      BOOPANG_FACTORY_DEMO: "${BOOPANG_FACTORY_DEMO:-false}"
      BOOPANG_LLM_MODEL: "${BOOPANG_LLM_MODEL:-claude-opus-5-5}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"     # .env 파일 또는 셸에서 주입 (저장소에 커밋 금지)
      # 로컬 무료 LLM (호스트에서 `ollama serve` 실행, 호스트의 OLLAMA_HOST=0.0.0.0 필요)
      BOOPANG_LLM_PROVIDER: "${BOOPANG_LLM_PROVIDER:-anthropic}"
      BOOPANG_OLLAMA_HOST: "${BOOPANG_OLLAMA_HOST:-http://host.docker.internal:11434}"
      BOOPANG_OLLAMA_MODEL: "${BOOPANG_OLLAMA_MODEL:-qwen2.5-coder:7b-instruct}"
      BOOPANG_FACTORY_MCP: "true"
      # 테스트 실행 모드: off(기본) | modal(클라우드 격리 샌드박스, 이 컨테이너에서도 사용 가능)
      #  - docker 는 호스트 도커 소켓이 필요하고 local 은 비격리라 컨테이너에서는 사용하지 마세요
      BOOPANG_FACTORY_EXEC: "${BOOPANG_FACTORY_EXEC:-off}"
      MODAL_TOKEN_ID: "${MODAL_TOKEN_ID:-}"            # modal 모드에서만 필요 (MCP 서버 프로세스에만 전달되고 샌드박스로는 전달되지 않음)
      MODAL_TOKEN_SECRET: "${MODAL_TOKEN_SECRET:-}"
      # 실제 WMS 스키마를 쓰려면 아래 두 줄과 volumes 의 주석을 함께 해제
      # BOOPANG_SCHEMA_FILE: /config/schema_config.json
    # volumes:
    #   - ./schema_config.json:/config/schema_config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *logging
    expose:
      - "8899"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
