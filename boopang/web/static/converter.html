<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부팡 물류 자동화 봇</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>📦 부팡 물류 및 주문 처리 자동화 봇</h1>
  <a href="/api/sample">샘플 파일 받기</a>
</header>
<main>
  <section id="drop" tabindex="0" role="button" aria-label="파일 업로드">
    <p><strong>패킹리스트/주문 엑셀을 여기로 끌어놓거나 클릭하세요</strong></p>
    <p class="muted">.xlsx / .csv · 최대 5MB · 최대 20,000행</p>
    <input id="file" type="file" accept=".xlsx,.csv" hidden>
  </section>
  <p id="msg" role="status"></p>
  <div id="result" hidden>
    <section id="cards" class="cards"></section>
    <section id="badges" class="badges"></section>
    <section class="export">
      <button data-fmt="csv">WMS CSV 받기</button>
      <button data-fmt="json">JSON 받기</button>
      <button data-fmt="xlsx">검수 리포트 XLSX 받기</button>
    </section>
    <nav class="tabs">
      <button id="tab-orders" class="active">주문 목록</button>
      <button id="tab-issues">검수 이슈</button>
    </nav>
    <div class="scroll"><table id="orders"></table><table id="issues" hidden></table></div>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
